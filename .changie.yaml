changesDir: changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## [{{ .Version }}](https://github.com/skyoo2003/kvs/releases/tag/{{ .Version }}) - {{ .Time.Format "2006-01-02" }}'
kindFormat: "### {{ .Kind }}"
changeFormat: "* {{ .Body }} ([#{{ .Custom.Issue }}](https://github.com/skyoo2003/kvs/issues/{{ .Custom.Issue }}))"
kinds:
  - label: Added
  - label: Changed
  - label: Deprecated
  - label: Removed
  - label: Fixed
  - label: Security
  - label: Documentation
  - label: Misc
custom:
  - key: Issue
    label: Issue Number
    type: int
