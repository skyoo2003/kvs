version: "2"
run:
  # v2 disables the timeout by default; keep the v1 bound so a pathological run
  # cannot burn a CI runner until the job-level limit.
  timeout: 10m
  tests: true
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - exhaustive
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    funlen:
      lines: 100
      statements: 50
    goconst:
      # Test fixtures repeat short literals on purpose.
      ignore-tests: true
      min-len: 2
      min-occurrences: 2
    gocritic:
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - wrapperFunc
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 15
    govet:
      enable:
        - shadow
    lll:
      line-length: 120
    misspell:
      locale: US
    nolintlint:
      # Keep every directive in the canonical `//nolint:linter // reason` form.
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/skyoo2003/kvs
  exclusions:
    generated: lax
