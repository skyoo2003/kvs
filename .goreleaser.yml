version: 2

project_name: kvs

env:
- GO111MODULE=on
- CGO_ENABLED=0

before:
  hooks:
  - go mod download

builds:
- id: kvs
  binary: kvs
  dir: cmd/kvs
  main: .
  ldflags:
  - -s -w -X main.version={{ .Version }}
  goos:
  - darwin
  - linux
  - windows
  goarch:
  - 386
  - amd64
  - arm
  - arm64
  goarm:
  - 6
  - 7
  ignore:
  - goos: darwin
    goarch: 386
  - goos: linux
    goarch: arm
    goarm: 6

archives:
- id: kvs
  formats: [ tar.gz ]
  format_overrides:
  - goos: windows
    formats: [ zip ]
  files:
    - LICENSE
    - README.md
    - CHANGELOG.md
    - CODE_OF_CONDUCT.md

changelog:
  disable: false

checksum:
  algorithm: sha256
  name_template: 'CHECKSUMS'

# Publishes Casks/kvs.rb to skyoo2003/homebrew-tap. The token comes from a
# GitHub App installed only on that repository: the job's own GITHUB_TOKEN
# cannot write to another repo.
#
# A cask rather than a formula because GoReleaser deprecated `brews`: a formula that installs a
# pre-built binary is what a cask is for. `brew install skyoo2003/tap/kvs` keeps working, and the
# tap needs a tap_migrations.json entry so anyone holding the old formula moves over on upgrade
# instead of being told it is gone.
homebrew_casks:
- ids:
  - kvs
  repository:
    owner: skyoo2003
    name: homebrew-tap
    token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
  homepage: "https://github.com/skyoo2003/kvs"
  description: "A key-value store you can run as a server or import as a Go module"
  license: "MIT"
  # Nothing signs or notarizes these binaries, so Gatekeeper quarantines what the cask staged and
  # the first run dies on a dialog rather than an error. Stripping the attribute is what makes an
  # unsigned cask runnable; it is not an optional nicety.
  hooks:
    post:
      install: |
        if OS.mac?
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/kvs"]
        end

dockers_v2:
- images:
  - ghcr.io/skyoo2003/kvs
  dockerfile: Dockerfile.goreleaser
  ids:
  - kvs
  platforms:
  - linux/amd64
  - linux/arm64
  sbom: false
  flags:
  - "--provenance=false"
  tags:
  - "{{ .Tag }}-alpine"
  - "v{{ .Major }}.{{ .Minor }}-alpine"
  - "v{{ .Major }}-alpine"
  - "latest-alpine"
  labels:
    org.opencontainers.image.created: "{{ .Date }}"
    org.opencontainers.image.source: "https://github.com/skyoo2003/kvs"
    org.opencontainers.image.title: "{{ .ProjectName }}"
    org.opencontainers.image.revision: "{{ .FullCommit }}"
    org.opencontainers.image.version: "{{ .Version }}"

release:
  github:
    owner: skyoo2003
    name: kvs
  name_template: "v{{ .Version }}"
  disable: false
  mode: replace
