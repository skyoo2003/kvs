project_name: kvs

env:
- GO111MODULE=on
- GOPROXY=https://goproxy.io

before:
  hooks:
  - go mod download

builds:
  - binary: kvs
    main: cmd/kvs/main.go
    env:
    - CGO_ENABLED=0
    goos:
    - darwin
    - linux
    goarch:
    - amd64

archives:
- format: tar.gz
  format_overrides:
  - goos: windows
    format: zip
  files:
    - LICENSE
    - README.md
    - CHANGELOG.md
    - CODE_OF_CONDUCT.md
    - CONTRIBUTING.md

changelog:
  sort: asc
  filters:
    exclude:
    - Merge pull request
    - Merge branch

checksum:
  algorithm: sha256
  name_template: 'checksums.txt'

# TODO: brews:

# TODO: dockers:

release:
  prerelease: true
  name_template: "{{ .ProjectName }}-v{{ .Version }}"

signs:
- artifacts: checksum
  args: ["--batch", "-u", "{{ .Env.GPG_FINGERPRINT }}", "--output", "${signature}", "--detach-sign", "${artifact}"]
