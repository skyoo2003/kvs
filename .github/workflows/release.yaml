name: Release

on:
  push:
    tags:
    - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
    - name: Checkout the code
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    # No QEMU needed: Dockerfile.goreleaser's final stage is COPY-only, so
    # buildx assembles linux/arm64 natively on this amd64 runner.
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to Docker Registry
      uses: docker/login-action@v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # GoReleaser reads this file at the very end, after building everything.
    # Fail in 2s instead of 5min when the changie fragment was never merged.
    - name: Verify release notes exist
      run: |
        if [ ! -f "changes/${{ github.ref_name }}.md" ]; then
          echo "::error::changes/${{ github.ref_name }}.md not found."
          echo "::error::Run 'changie batch ${{ github.ref_name }}' and 'changie merge' before pushing the tag."
          exit 1
        fi
    # Short-lived token scoped to skyoo2003/homebrew-tap only, for the brews
    # section. Expires with the job, so nothing long-lived is stored anywhere.
    - name: Mint a Homebrew tap token
      id: tap_token
      uses: actions/create-github-app-token@v3.2.0
      with:
        app-id: ${{ secrets.TAP_APP_ID }}
        private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
        owner: skyoo2003
        repositories: homebrew-tap
    - name: Execute GoReleaser
      uses: goreleaser/goreleaser-action@v7.2.3
      with:
        version: "~> v2"
        args: release --clean --release-notes changes/${{ github.ref_name }}.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        HOMEBREW_TAP_TOKEN: ${{ steps.tap_token.outputs.token }}
    - name: Upload assets
      uses: actions/upload-artifact@v7
      with:
        name: kvs
        path: dist/*
