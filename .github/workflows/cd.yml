name: CD

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "Dockerfile.goreleaser"
      - ".goreleaser.yml"

jobs:
  docker:
    runs-on: ubuntu-latest
    if: github.repository == 'skyoo2003/kvs'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/skyoo2003/kvs:dev
            ghcr.io/skyoo2003/kvs:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
