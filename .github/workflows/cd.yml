name: CD

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "Dockerfile.goreleaser"
      - ".goreleaser.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "Dockerfile.goreleaser"
      - ".goreleaser.yml"

jobs:
  docker:
    runs-on: ubuntu-latest
    if: github.repository == 'skyoo2003/kvs'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On pull_request the image is only built, never pushed: this is what
      # validates Dockerfile changes (e.g. base image bumps) before merge.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/skyoo2003/kvs:dev
            ghcr.io/skyoo2003/kvs:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
