name: CD

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "Dockerfile.goreleaser"
      - ".dockerignore"
      - ".goreleaser.yml"
      - ".github/workflows/cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "Dockerfile.goreleaser"
      - ".dockerignore"
      - ".goreleaser.yml"
      - ".github/workflows/cd.yml"

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    if: github.repository == 'skyoo2003/kvs'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On pull_request the image is only built, never pushed: this is what
      # validates Dockerfile changes (e.g. base image bumps) before merge.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ghcr.io/skyoo2003/kvs:dev
            ghcr.io/skyoo2003/kvs:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building alone does not catch runtime breakage from USER/ENTRYPOINT
      # changes, so actually run the binary as the unprivileged user.
      - name: Smoke test the image
        if: github.event_name == 'pull_request'
        run: docker run --rm ghcr.io/skyoo2003/kvs:dev version

  # The job above only builds Dockerfile. The release path uses
  # Dockerfile.goreleaser + dockers_v2, which used to fail for the first time
  # on a real tag push. A snapshot release exercises it before merge.
  goreleaser:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.repository == 'skyoo2003/kvs'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: docker/setup-buildx-action@v3

      - name: Snapshot release
        uses: goreleaser/goreleaser-action@v7.0.0
        with:
          version: "~> v2"
          args: release --snapshot --clean
