name: Docs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yaml"
      - "hugo.toml"
      - "content/**"
      - "layouts/**"
      - "static/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "docs/RELEASE.md"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yaml"
      - "hugo.toml"
      - "content/**"
      - "layouts/**"
      - "static/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "docs/RELEASE.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.148.2'

      - name: Build documentation site
        run: hugo build --gc --minify

      - name: Deploy documentation site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
          clean: true
