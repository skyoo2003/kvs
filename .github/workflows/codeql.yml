name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
  pull_request:
    branches: [main]
    paths:
      - "**/*.go"
  schedule:
    - cron: "0 3 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: github/codeql-action/init@v4.37.8
        with:
          languages: go
          build-mode: manual

      - run: |
          go build ./...

      - uses: github/codeql-action/analyze@v4.37.8
