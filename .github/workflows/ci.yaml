name: CI

on:
  push:
    branches:
    - main
    paths:
    - "**/*.go"
    - "go.mod"
    - "go.sum"
    - "README.md"
    - ".goreleaser.yml"
    - ".golangci.yaml"
    - "Makefile"
    - ".github/workflows/**"
    - "**/*.tmpl"
  pull_request:
    branches:
    - main
    paths:
    - "**/*.go"
    - "go.mod"
    - "go.sum"
    - "README.md"
    - ".goreleaser.yml"
    - ".golangci.yaml"
    - "Makefile"
    - ".github/workflows/**"
    - "**/*.tmpl"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout the code
      uses: actions/checkout@v7.0.1
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Execute golangci-lint
      uses: golangci/golangci-lint-action@v9.3.0
      with:
        version: v2.12.2
    - name: Go test
      run: make test
    - name: Go build
      run: make build
    # Validates .goreleaser.yml schema changes (formats:, dockers_v2.platforms, ...)
    # which otherwise only fail on a real tag push.
    - name: Set up GoReleaser
      uses: goreleaser/goreleaser-action@v7.2.3
      with:
        version: "~> v2"
        install-only: true
    - name: Check GoReleaser config
      # `brews` publishes the Homebrew formula but is deprecated (GoReleaser
      # removes it in v3), so `check` always exits non-zero today.
      run: |
        out=$(goreleaser check 2>&1) && { echo "$out"; exit 0; }
        echo "$out"
        # Non-zero: tolerate only when the sole reason is the deprecation. A real
        # schema error reports a different reason, so the job still fails.
        echo "$out" | grep -q "uses deprecated properties" || exit 1
