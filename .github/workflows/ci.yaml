name: CI

on:
  push:
    branches:
    - main
    paths:
    - "**/*.go"
    - "go.mod"
    - "go.sum"
    - "README.md"
    - ".goreleaser.yml"
    - "Makefile"
    - ".github/workflows/*.yaml"
    - "**/*.tmpl"
  pull_request:
    branches:
    - main
    paths:
    - "**/*.go"
    - "go.mod"
    - "go.sum"
    - "README.md"
    - ".goreleaser.yml"
    - "Makefile"
    - ".github/workflows/*.yaml"
    - "**/*.tmpl"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        go-version: [ 1.13, 1.14, 1.15 ]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout the code
      uses: actions/checkout@v6.0.2
    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v2
      with:
        go-version: ${{ matrix.go-version }}
    - name: Execute golangci-lint
      uses: golangci/golangci-lint-action@v6.1.1
      with:
        version: v1.29
    - name: Go test
      run: make test
    - name: Go build
      run: make build
