name: CI

on:
  push:
    branches:
    - main
    paths:
    - "**/*.go"
    - "go.mod"
    - "go.sum"
    - "README.md"
    - ".goreleaser.yml"
    - "Makefile"
    - ".github/workflows/**"
    - "**/*.tmpl"
  pull_request:
    branches:
    - main
    paths:
    - "**/*.go"
    - "go.mod"
    - "go.sum"
    - "README.md"
    - ".goreleaser.yml"
    - "Makefile"
    - ".github/workflows/**"
    - "**/*.tmpl"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout the code
      uses: actions/checkout@v7.0.0
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Execute golangci-lint
      uses: golangci/golangci-lint-action@v6.1.1
      with:
        version: v1.64.8
    - name: Go test
      run: make test
    - name: Go build
      run: make build
    # Validates .goreleaser.yml schema changes (formats:, dockers_v2.platforms, ...)
    # which otherwise only fail on a real tag push.
    - name: Check GoReleaser config
      uses: goreleaser/goreleaser-action@v7.0.0
      with:
        version: "~> v2"
        args: check
